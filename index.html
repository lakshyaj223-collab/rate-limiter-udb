<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rate Limiter Dashboard</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; font-size: 1.4rem; }
    p { color: #94a3b8; font-size: 0.9rem; }
    .stats {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      margin: 1.2rem 0;
    }
    .stat-box span { display: block; font-size: 0.75rem; color: #94a3b8; }
    .stat-box strong { font-size: 1.3rem; color: #38bdf8; }
    button {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    .log {
      margin-top: 1.2rem;
      max-height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .entry {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.4rem;
    }
    .ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-left: 3px solid #22c55e; }
    .blocked { background: rgba(239, 68, 68, 0.15); color: #f87171; border-left: 3px solid #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <h2>API Rate Limiter Tester</h2>
    <p>MongoDB TTL Document Store &bull; Limit: <strong>5 requests / 60s</strong></p>

    <div class="stats">
      <div class="stat-box"><span>Total Limit</span><strong>5</strong></div>
      <div class="stat-box"><span>Remaining</span><strong id="remaining">5</strong></div>
      <div class="stat-box"><span>Last Status</span><strong id="status">-</strong></div>
    </div>

    <button onclick="sendRequest()">Send Request to /api/data</button>

    <div class="log" id="log"></div>
  </div>

  <script>
    async function sendRequest() {
      const time = new Date().toLocaleTimeString();
      const res = await fetch('/api/data');
      const data = await res.json();

      const remaining = res.headers.get('X-RateLimit-Remaining') ?? '0';
      document.getElementById('remaining').textContent = res.status === 429 ? '0' : remaining;
      document.getElementById('status').textContent = res.status;
      document.getElementById('status').style.color = res.status === 200 ? '#4ade80' : '#f87171';

      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.className = `entry ${res.status === 200 ? 'ok' : 'blocked'}`;
      div.textContent = `[${time}] ${res.status} — ${data.message}`;
      log.prepend(div);
    }
  </script>
</body>
</html>
